name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The checks that need nothing but this repo: lint.py against the module, and
  # lint.py's own tests. Fast, and the only job a fork can always run. The core
  # parity test needs Celerp, so it runs in the module job instead. Both jobs find
  # the module folder with `lint.py --find`, so a renamed module needs no edit here.
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-xdist
      - name: Find the module folder
        run: |
          MODULE=$(python lint.py --find)
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"
      - run: python lint.py "$MODULE"
      - run: pytest tests -n auto -rs --ignore=tests/test_core_parity.py

  # The module's own suite, which needs Celerp importable: it renders the real
  # shared components and drives the real API app. Celerp is checked out beside
  # this repo and installed, so a change to a shared component that would break
  # this module shows up here rather than on someone's restart. Celerp is pinned to
  # the commit whose module contract lint.py mirrors.
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: celerp/celerp
          ref: e9ff78ec0e8dca5cac0448a50400e03946d9a668
          path: celerp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ./celerp
      - run: pip install pytest pytest-xdist aiosqlite
      - name: Find the module folder
        run: |
          MODULE=$(python lint.py --find)
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"
      - run: pytest "$MODULE/tests" -n auto -rs
        env:
          PYTHONPATH: ${{ github.workspace }}/celerp:${{ github.workspace }}/${{ env.MODULE }}
      # lint.py's copies of Celerp's manifest rules, held to the originals. Required:
      # without Celerp importable the test fails instead of skipping.
      - run: pytest tests/test_core_parity.py -rs
        env:
          PYTHONPATH: ${{ github.workspace }}/celerp
          CELERP_PARITY_REQUIRED: "1"
